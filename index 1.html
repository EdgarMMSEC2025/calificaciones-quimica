<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Consulta individual de calificaciones 2027-1"><title>Calificaciones 2027-1</title>
<style>:root{--ipn:#6b1f3a;--azul:#0f5f78;--fondo:#f4f7fa;--borde:#dce4ea;--texto:#17212b}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--fondo);color:var(--texto)}header{background:linear-gradient(135deg,var(--ipn),#8d3152);color:#fff;padding:28px 18px}.wrap{max-width:1050px;margin:auto}.sub{opacity:.9;margin:.4rem 0 0}.card{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:22px;box-shadow:0 10px 28px #18314212;margin:22px 0}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}label{font-weight:700;font-size:.92rem}select,input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #b9c6cf;font:inherit;margin-top:7px}button{background:var(--azul);color:#fff;border:0;font-weight:800;cursor:pointer}button:hover{filter:brightness(.9)}button:focus,input:focus,select:focus{outline:3px solid #66b7d5;outline-offset:2px}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#eaf6fa}.error{background:#fff0f0;color:#8b1b1b}.hidden{display:none}.head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.pill{background:#edf3f6;border-radius:999px;padding:7px 12px;font-weight:700}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kpi{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:18px}.kpi b{display:block;font-size:1.9rem;margin-top:6px;color:var(--ipn)}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid var(--borde);text-align:center}th{background:#eef4f6}td:first-child,th:first-child{text-align:left}.bar{height:9px;background:#e1e8ec;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--azul)}footer{text-align:center;color:#667784;padding:15px 15px 30px}@media(max-width:700px){.form{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.card{padding:16px}}</style></head>
<body><header><div class="wrap"><h1>Consulta de Calificaciones 2027-1</h1><p class="sub">Laboratorios de Química · ESIQIE</p></div></header><main class="wrap"><section class="card"><div class="form"><label>Grupo<select id="grupo"><option value="">Seleccione un grupo</option></select></label><label>Boleta<input id="boleta" autocomplete="off" maxlength="14" placeholder="Ej. 2026320893 o PP27000983"></label><button id="buscar" type="button">Consultar</button></div><div id="mensaje" class="msg" role="status" aria-live="polite">Cargando información…</div></section>
<section id="resultado" class="hidden"><div class="card head"><div><h2 id="nombre"></h2><div id="boletaVista"></div></div><div id="grupoVista" class="pill"></div></div><div class="kpis"><div class="kpi">Promedio de prácticas<b id="promedio"></b></div><div class="kpi">Puntos de teoría<b id="teoria"></b></div><div class="kpi">Prácticas registradas<b id="cantidad"></b></div></div><div class="card tablebox"><h3>Detalle por práctica</h3><table><thead><tr><th>Práctica</th><th>Actividad previa</th><th>Laboratorio</th><th>Bitácora</th><th>Extra</th><th>Calificación</th><th>Avance</th></tr></thead><tbody id="detalle"></tbody></table></div></section></main><footer>Información académica para consulta individual.</footer>
<script>'use strict';let datos=[];const $=id=>document.getElementById(id),norm=v=>String(v??'').trim().toUpperCase();function mensaje(t,e=false){const m=$('mensaje');m.textContent=t;m.className='msg'+(e?' error':'')}function fmt(n){return Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:2})}async function iniciar(){try{const r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);datos=await r.json();const gs=[...new Set(datos.map(x=>x.grupo))].sort();for(const g of gs){const o=document.createElement('option');o.value=g;o.textContent=g;$('grupo').appendChild(o)}mensaje(`Información disponible para ${datos.length} estudiantes.`)}catch(e){mensaje('No se pudo cargar data.json. Verifique que esté en la misma carpeta que index.html.',true)}}function buscar(){const g=norm($('grupo').value),b=norm($('boleta').value);if(!g||!b){mensaje('Seleccione el grupo y escriba la boleta.',true);$('resultado').classList.add('hidden');return}const a=datos.find(x=>norm(x.grupo)===g&&norm(x.boleta)===b);if(!a){mensaje('No se encontró un registro con ese grupo y boleta.',true);$('resultado').classList.add('hidden');return}$('nombre').textContent=a.nombre;$('boletaVista').textContent='Boleta: '+a.boleta;$('grupoVista').textContent='Grupo '+a.grupo;$('promedio').textContent=fmt(a.calificacion_final);$('teoria').textContent=fmt(a.puntos_teoria);$('cantidad').textContent=a.practicas.length;$('detalle').innerHTML=a.practicas.map(p=>`<tr><td>Práctica ${p.numero}</td><td>${fmt(p.actividad_previa)}</td><td>${fmt(p.laboratorio)}</td><td>${fmt(p.bitacora)}</td><td>${fmt(p.puntos_extra)}</td><td><b>${fmt(p.calificacion)}</b></td><td><div class="bar" aria-label="${fmt(p.calificacion)} de 100"><span style="width:${Math.max(0,Math.min(100,Number(p.calificacion)||0))}%"></span></div></td></tr>`).join('');$('resultado').classList.remove('hidden');mensaje('Consulta realizada correctamente.')}$('buscar').addEventListener('click',buscar);$('boleta').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});iniciar();</script></body></html>
